plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vibe.generated.p20260823'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vibe.generated.p20260823'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        // AGP 8.x (D8) requires Java 8 minimum; VERSION_1_7 causes a build error.
        // The source code itself uses only Java 7 syntax, so Java 8 target is fully compatible.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    // org.json is already bundled inside android.jar; adding it explicitly
    // causes a "Duplicate class" build error, so it is intentionally omitted.
}
