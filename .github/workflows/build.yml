name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # run_number 单调递增，既当 versionCode（安卓要求覆盖安装时必须更大），
      # 也拼进 versionName，使 APK 版本号与下面的 Release tag 完全一致。
      - name: Compute version
        id: ver
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            -PappVersionName=${{ steps.ver.outputs.version }} \
            -PappVersionCode=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 只有推到 main 才发版。分支构建与 PR 构建同样跑完整的 assembleDebug，
      # 但不能建 Release —— 应用内的检查更新读的正是最新 Release，
      # 从未合并的分支发一个版本会被所有用户当成正式更新装下去。
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body: |
            ${{ github.event.head_commit.message }}

            ---
            调试签名构建，可直接安装。应用内「设置 → 检查更新」会读取这里的最新版本。
          files: app/build/outputs/apk/debug/app-debug.apk
